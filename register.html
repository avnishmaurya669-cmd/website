<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            background: #5e93be;
        }

        h2 {
            text-align: center;
            color: #bb0e0e;
        }

        form {
            width: 100%;
            max-width:450px;
            margin: 100px auto;
            background: #c5944b;
            padding: 20px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <form onsubmit="registerUser(event)">
        <h2>Register</h2>
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="Enter the valid name" required><br><br>

        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname" placeholder="Enter the valid last name" required><br><br>
        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" maxlength="10" placeholder="Enter the valid phone number"
            pattern="[0-9]{10}" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" required>
        <label for="female">Female</label><br><br>

        <label for="subject">Subject:</label><br>
        <select id="subject" name="subject" requred><br><br>
            <option value=" ">--Select subject--</option>
            <option value="Mathe">Mathe</option>
            <option value="English">English</option>
            <option value="computer">Computer</option>
            <option value="computer">Computer science</option>
            <option value="computer">Poly...</option>
            <option value="computer">B.Teach</option>
            <option value="computer">BCA AI</option>
            <option value="computer">BCA</option>
            <option value="computer">MCA</option>
        </select><br><br>
        <!--Date (calendar) -->
        <label>Select Data:</label><br>
        <input type="date" name="date" required><br><br>


        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" maxlength="8" pattern="[0-9,A-Z]{8}" required>
        <button type="submit">Register</button>
        <p>Already registered? <a href="login.html">Login</a></p>
    </form>

    <script>
        function togglePassword() {
            let pwd = document.getElementById("password");
            pwd.type = pwd.type === "password" ? "text" : "password";
        }
        function registerUser(e) {
            e.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            localStorage.setItem("email", email);
            localStorage.setItem("password", password);

            alert("Registration Successful!");
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
